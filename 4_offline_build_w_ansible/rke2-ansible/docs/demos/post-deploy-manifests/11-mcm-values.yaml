apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: rancher
  namespace: kube-system
spec:
  valuesContent: |-
    rancherImage: harbor.apps.orin.local/rancher/rancher
    hostname: mcm.apps.demos.local
    bootstrapPassword: "admin"
    ingress:
      tls:
        source: "secret"
    useBundledSystemChart: "true"
    privateCA: "true"
    extraEnv:
      - name: CATTLE_RKE_METADATA_CONFIG
        value: '{"refresh-interval-minutes":"0","url":"https://releases.rancher.com/kontainer-driver-metadata/release-2.14.3/data.json"}'

