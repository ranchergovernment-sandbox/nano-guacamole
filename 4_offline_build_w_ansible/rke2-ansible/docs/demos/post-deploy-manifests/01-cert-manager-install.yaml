apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  namespace: kube-system
  name: cert-manager
spec:
  targetNamespace: cert-manager
  createNamespace: true
  insecureSkipTLSVerify: true
  chart: oci://harbor.apps.orin.local/hauler/cert-manager
  version: "1.20.2"
  valuesContent: |-
    crds:
      enabled: true
