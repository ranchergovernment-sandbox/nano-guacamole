---
kubeconfig_path: /etc/rancher/rke2/rke2.yaml
# RKE2's bundled kubectl. Change this if your nodes symlink kubectl
# elsewhere (check with: which kubectl / ls /var/lib/rancher/rke2/bin/).
kubectl_bin: /var/lib/rancher/rke2/bin/kubectl

# New storage class created for the images below, so the built-in/
# protected "harvester-longhorn" class is never touched.
#new_storage_class_name: harvester-longhorn-r1
storage_class_name: harvester-longhorn

# List of images to create on every host this role runs against.
# Each item: { name, namespace, url }
images: []
