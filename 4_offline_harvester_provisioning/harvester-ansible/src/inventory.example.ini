# inventory.example.ini
#
# One entry per Harvester cluster. ansible_host should point at any
# management-node IP/hostname you can SSH to for that cluster.
# Rename to inventory.ini and fill in your real hosts.

[harvester_clusters]
harvester-01 ansible_host=10.0.1.10
harvester-02 ansible_host=10.0.1.11
harvester-03 ansible_host=10.0.1.12
# ... etc, up to harvester-20

[harvester_clusters:vars]
ansible_user=root
# Or, if you SSH as a non-root user with sudo:
# ansible_user=youruser
# ansible_become=true

# If clusters get rebuilt frequently, host SSH keys will change and you'll
# get "REMOTE HOST IDENTIFICATION HAS CHANGED" warnings. Either manage
# known_hosts as part of your build automation, or (less secure) add:
# ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
