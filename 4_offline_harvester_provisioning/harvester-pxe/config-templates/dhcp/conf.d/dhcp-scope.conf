option architecture-type code 93 = unsigned integer 16;

#DHCP Scope For Mgmt.  Harvester Nodes get their own Direct Configs
subnet 10.1.1.0 netmask 255.255.255.0 {
    option routers 10.1.1.1;
    option domain-name-servers 8.8.8.8;
    range 10.1.1.21 10.1.1.100;
    if exists user-class and option user-class = "iPXE" {
      # iPXE Boot
      if option architecture-type = 00:07 {
        filename "http://10.1.1.2/pxe/harvester/v1.8.1-govt.2/ipxe-efi-dummy";
      } else {
        filename "http://10.1.1.2/pxe/harvester/v1.8.1-govt.2/ipxe-dummy";
      }
    } elsif substring (option vendor-class-identifier, 0, 10) = "HTTPClient" {
      # UEFI HTTP Boot
      option vendor-class-identifier "HTTPClient";
      filename "http://10.1.1.2/pxe/harvester/v1.8.1-govt.2/ipxe-x86_64.efi";
    } else {
      # PXE Boot
      if option architecture-type = 00:07 {
        # UEFI
        filename "harvester/ipxe-x86_64.efi";
      } else {
        # Non-UEFI
        filename "harvester/undionly.kpxe";
      }
    }

}

